name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build API
        run: dotnet build "$(find . -name 'RaceDay.Api.csproj' | head -n 1)" --configuration Release

      - name: Build MVC web app
        run: dotnet build "$(find . -name 'RaceDay.Web.csproj' | head -n 1)" --configuration Release

      - name: Run unit tests
        run: dotnet test "$(find . -name '*Tests.csproj' | head -n 1)" --configuration Release --verbosity normal
