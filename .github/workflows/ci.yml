name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore "$(find . -name '*Tests.csproj' | head -n 1)"

      - name: Build
        run: dotnet build "$(find . -name '*Tests.csproj' | head -n 1)" --no-restore

      - name: Run unit tests
        run: dotnet test "$(find . -name '*Tests.csproj' | head -n 1)" --no-build --verbosity normal
